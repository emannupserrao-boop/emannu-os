<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Rocky: mascote original do EMANNU OS (pet-robô azul e vermelho com pluma vermelha). -->
  <defs>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#1d4fbf"/>
    </linearGradient>
    <linearGradient id="pluma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#c81d2a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#111827"/>
  <!-- pluma -->
  <path d="M128 70 C 120 40, 150 18, 186 20 C 166 30, 160 44, 162 58 C 172 50, 190 48, 204 54 C 182 60, 168 72, 156 86 Z" fill="url(#pluma)"/>
  <path d="M150 34 C 160 30, 170 28, 180 28" stroke="#ffd2cc" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- orelhas / sensores -->
  <circle cx="58" cy="138" r="18" fill="#c81d2a"/>
  <circle cx="198" cy="138" r="18" fill="#c81d2a"/>
  <circle cx="58" cy="138" r="7" fill="#ffb3ab"/>
  <circle cx="198" cy="138" r="7" fill="#ffb3ab"/>
  <!-- cabeça -->
  <rect x="62" y="72" width="132" height="132" rx="54" fill="url(#casco)"/>
  <!-- faixa vermelha na testa -->
  <path d="M78 104 Q128 82 178 104 L174 116 Q128 98 82 116 Z" fill="#e2323f"/>
  <!-- visor -->
  <rect x="80" y="122" width="96" height="50" rx="25" fill="url(#visor)"/>
  <!-- olhos -->
  <ellipse cx="108" cy="147" rx="10" ry="12" fill="#6ff0ff"/>
  <ellipse cx="148" cy="147" rx="10" ry="12" fill="#6ff0ff"/>
  <circle cx="111" cy="142" r="3.5" fill="#ffffff"/>
  <circle cx="151" cy="142" r="3.5" fill="#ffffff"/>
  <!-- sorriso -->
  <path d="M116 186 Q128 194 140 186" stroke="#0d1b2e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- brilho do casco -->
  <path d="M84 92 Q100 80 118 78" stroke="#a9ccff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
</svg>
